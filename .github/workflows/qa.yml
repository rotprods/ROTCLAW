name: qa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile scripts/*.py router/*.py
      - run: bash -n context/RUNTIME_PREFLIGHT.sh scripts/install.sh scripts/bootstrap-private-env.sh scripts/verify-live.sh
      - run: python scripts/ancestry_check.py
      - run: python scripts/qa.py
      - run: python scripts/adversarial.py
      - run: python scripts/benchmark.py
