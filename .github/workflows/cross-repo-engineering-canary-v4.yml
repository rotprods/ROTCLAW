name: cross-repo-engineering-canary-v4

on:
  push:
    branches: [reconstruct/v6-full-composite]
    paths: ['delegation/cross-repo-engineering-v4/*.json']

permissions:
  contents: read

jobs:
  multi-agent-engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve and bind mission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mission="$(git show --pretty='' --name-only HEAD | grep '^delegation/cross-repo-engineering-v4/.*\.json$')"
          test "$(printf '%s\n' "$mission" | sed '/^$/d' | wc -l)" -eq 1
          echo "MISSION=$mission"
          python3 -m py_compile scripts/cross_repo_identity_orchestrator.py
          printf '%s' "$mission" > /tmp/mission-path
      - name: Install pinned Ollama and local engineering model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ollama.tar.zst https://github.com/ollama/ollama/releases/download/v0.32.14/ollama-linux-amd64.tar.zst
          echo 'c620917a71e146ab3a7f893084f066069c4c65d144ef8379a91c3cbe8b27de8f  /tmp/ollama.tar.zst' | sha256sum -c -
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen3:1.7b-q4_K_M
      - name: Execute provenance-bound multi-agent pipeline
        shell: bash
        run: |
          set -euo pipefail
          mission="$(cat /tmp/mission-path)"
          python3 scripts/cross_repo_identity_orchestrator.py --mission "$mission" --orchestrator-commit "$GITHUB_SHA"
          python3 - "$mission" "$GITHUB_SHA" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          evidence=json.load(open('/tmp/cross-repo-evidence/EVIDENCE.json'))
          mission=Path(sys.argv[1])
          assert evidence['mission_id']==mission.stem
          assert evidence['mission_file']==str(mission)
          assert evidence['mission_sha256']==hashlib.sha256(mission.read_bytes()).hexdigest()
          assert evidence['orchestrator_commit']==sys.argv[2]
          print('PROVENANCE_BINDING_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rotclaw-cross-repo-engineering-v4-${{ github.sha }}
          path: /tmp/cross-repo-evidence/
          if-no-files-found: error
          retention-days: 7
