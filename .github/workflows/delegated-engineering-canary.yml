name: delegated-engineering-canary

on:
  push:
    branches:
      - reconstruct/v6-full-composite
    paths:
      - 'delegation/engineering-canary/*.json'

permissions:
  contents: read

jobs:
  builder-reviewer-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Resolve bounded A2 mission
        id: mission
        shell: bash
        run: |
          set -euo pipefail
          mission="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^delegation/engineering-canary/.*\.json$' | head -n1)"
          test -n "$mission"
          python scripts/mission_gate.py "$mission"
          python3 - "$mission" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          m=json.load(open(sys.argv[1]))
          expected=['scripts/relay_daemon_check.py','scripts/result_consumer.py']
          assert sorted(m['allowed_paths']) == expected
          assert m['risk_class'] == 'A2'
          assert set(m['allowed_actions']) <= {'read','edit','test'}
          print('path='+sys.argv[1])
          print('mission_id='+m['mission_id'])
          PY

      - name: Install pinned Ollama and builder model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ollama.tar.zst https://github.com/ollama/ollama/releases/download/v0.32.14/ollama-linux-amd64.tar.zst
          echo 'c620917a71e146ab3a7f893084f066069c4c65d144ef8379a91c3cbe8b27de8f  /tmp/ollama.tar.zst' | sha256sum -c -
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen3:1.7b-q4_K_M

      - name: Install OpenClaw and isolated local config
        shell: bash
        run: |
          set -euo pipefail
          npm install -g openclaw@2026.8.1-beta.3
          python3 - <<'PY'
          import json
          p=json.load(open('config/openclaw.local-ollama.json'))
          m=p['models']['providers']['ollama']['models'][0]
          m['id']='qwen3:1.7b-q4_K_M'
          m['name']='Qwen3 1.7B Q4_K_M'
          m['contextWindow']=8192
          m['maxTokens']=384
          m.setdefault('params',{})['num_ctx']=8192
          m['params']['thinking']=False
          json.dump(p,open('/tmp/openclaw-engineering.json','w'),indent=2)
          PY
          OPENCLAW_CONFIG_PATH=/tmp/openclaw-engineering.json openclaw config validate --json

      - name: Builder agent generates minimal runtime fix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/builder-prompt.txt <<'EOF'
          BUILDER task: fix one Python branch. Return only the five replacement code lines, or a JSON object whose "content" value is only those five lines.
          Existing branch:
                  else:
                      (incoming/(env.name+'.error')).write_text(p.stderr+p.stdout)
          Required algorithm in order: else; set quarantine to incoming/(env.name+'.error'); set diagnostics to incoming/(env.name+'.error.log'); os.replace(env, quarantine); diagnostics.write_text(p.stderr+p.stdout). Preserve indentation. No semicolons. No other code.
          EOF
          timeout 100s openclaw agent exec "$(cat /tmp/builder-prompt.txt)" \
            --config /tmp/openclaw-engineering.json \
            --cwd "$PWD" \
            --model 'ollama/qwen3:1.7b-q4_K_M' \
            --timeout 90 --local-model-lean \
            > /tmp/builder.raw
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/builder.raw').read_text().strip()
          try:
              obj=json.loads(raw)
              if isinstance(obj,dict) and isinstance(obj.get('content'),str): raw=obj['content'].strip()
          except json.JSONDecodeError:
              pass
          if raw.startswith('```'):
              lines=raw.splitlines()[1:]
              if lines and lines[-1].strip()=='```': lines=lines[:-1]
              raw='\n'.join(lines).strip()
          lines=[x.rstrip() for x in raw.splitlines() if x.strip()]
          assert len(lines)==5, lines
          assert lines[0]=='        else:', lines
          assert lines[1].strip()=="quarantine=incoming/(env.name+'.error')", lines
          assert lines[2].strip()=="diagnostics=incoming/(env.name+'.error.log')", lines
          assert lines[3].strip()=='os.replace(env, quarantine)', lines
          assert lines[4].strip()=='diagnostics.write_text(p.stderr+p.stdout)', lines
          assert lines[1].startswith('            ') and lines[2].startswith('            ') and lines[3].startswith('            ') and lines[4].startswith('            ')
          old="        else:\n            (incoming/(env.name+'.error')).write_text(p.stderr+p.stdout)"
          p=Path('scripts/result_consumer.py'); src=p.read_text(); assert src.count(old)==1
          p.write_text(src.replace(old,'\n'.join(lines)))
          Path('/tmp/builder.extracted').write_text('\n'.join(lines)+'\n')
          PY

      - name: Trusted test oracle adds regression scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/relay_daemon_check.py'); src=p.read_text()
          marker="    print('RELAY_RESULT_CONSUMER_PASS')"; assert src.count(marker)==1
          block="""    bad_mid='relay-test-error'
              bad_mission=dict(mission); bad_mission['mission_id']=bad_mid; bad_mission['work_branch']='agent/'+bad_mid
              bad_mp=b/'sentinel/frontier-export'/(bad_mid+'.json'); bad_mp.write_text(json.dumps(bad_mission))
              bad_env=b/'sentinel/relay/incoming'/(bad_mid+'.frontier-result.json'); bad_env.write_text('{}')
              subprocess.run(['python3',str(ROOT/'scripts/result_consumer.py'),'--once'],check=True,env=env)
              quarantine=b/'sentinel/relay/incoming'/(bad_mid+'.frontier-result.json.error')
              diagnostics=b/'sentinel/relay/incoming'/(bad_mid+'.frontier-result.json.error.log')
              assert not bad_env.exists()
              assert quarantine.exists() and diagnostics.exists()
              snapshot=(quarantine.read_bytes(),diagnostics.read_bytes())
              subprocess.run(['python3',str(ROOT/'scripts/result_consumer.py'),'--once'],check=True,env=env)
              assert snapshot==(quarantine.read_bytes(),diagnostics.read_bytes())
          """
          p.write_text(src.replace(marker,block+marker))
          PY

      - name: Trusted boundary and deterministic regression QA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mission_gate.py "${{ steps.mission.outputs.path }}" --check-worktree
          changed="$({ git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u)"
          expected="$(printf '%s\n' scripts/relay_daemon_check.py scripts/result_consumer.py | sort)"
          test "$changed" = "$expected"
          python -m py_compile scripts/result_consumer.py scripts/relay_daemon_check.py
          python scripts/relay_daemon_check.py
          git diff --check

      - name: Independent reviewer agent audits candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff -- scripts/result_consumer.py scripts/relay_daemon_check.py > /tmp/candidate.patch
          python3 - <<'PY' > /tmp/reviewer-prompt.txt
          from pathlib import Path
          print('Independent REVIEWER. The deterministic regression test already passed. Review this small patch only for an obvious correctness or safety defect: generic ingest failure must atomically leave active incoming processing, diagnostics are separate, second run does not retry, success/replay branches are untouched. Return first token REVIEW_PASS unless you find a concrete defect; otherwise REVIEW_FAIL. Then max 4 short lines.')
          print(Path('/tmp/candidate.patch').read_text())
          PY
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/openclaw-engineering.json'))
          p['models']['providers']['ollama']['models'][0]['maxTokens']=128
          json.dump(p,open('/tmp/openclaw-reviewer.json','w'),indent=2)
          PY
          timeout 100s openclaw agent exec "$(cat /tmp/reviewer-prompt.txt)" \
            --config /tmp/openclaw-reviewer.json \
            --cwd "$PWD" \
            --model 'ollama/qwen3:1.7b-q4_K_M' \
            --timeout 90 --local-model-lean \
            > /tmp/reviewer.raw
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/reviewer.raw').read_text().strip()
          try:
              obj=json.loads(text)
              if isinstance(obj,dict) and isinstance(obj.get('content'),str): text=obj['content'].strip()
          except json.JSONDecodeError:
              pass
          assert text, 'empty reviewer output'
          assert text.split()[0]=='REVIEW_PASS', text[:500]
          Path('/tmp/reviewer.extracted').write_text(text+'\n')
          PY

      - name: Build engineering evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/engineering-evidence/files
          cp scripts/result_consumer.py /tmp/engineering-evidence/files/result_consumer.py
          cp scripts/relay_daemon_check.py /tmp/engineering-evidence/files/relay_daemon_check.py
          cp /tmp/candidate.patch /tmp/engineering-evidence/candidate.patch
          cp /tmp/builder.raw /tmp/engineering-evidence/builder.raw
          cp /tmp/builder.extracted /tmp/engineering-evidence/builder.extracted
          cp /tmp/reviewer.raw /tmp/engineering-evidence/reviewer.raw
          cp /tmp/reviewer.extracted /tmp/engineering-evidence/reviewer.extracted
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          Path('/tmp/engineering-evidence/EVIDENCE.json').write_text(json.dumps({
            'schema':'rotclaw.delegated-engineering-evidence.v3',
            'mission_id':'${{ steps.mission.outputs.mission_id }}',
            'source_commit':'${{ github.sha }}',
            'changed_paths':['scripts/relay_daemon_check.py','scripts/result_consumer.py'],
            'patch_sha256':h('/tmp/candidate.patch'),
            'result_consumer_sha256':h('scripts/result_consumer.py'),
            'relay_daemon_check_sha256':h('scripts/relay_daemon_check.py'),
            'builder_raw_sha256':h('/tmp/builder.raw'),
            'builder_extracted_sha256':h('/tmp/builder.extracted'),
            'reviewer_raw_sha256':h('/tmp/reviewer.raw'),
            'reviewer_extracted_sha256':h('/tmp/reviewer.extracted'),
            'builder':'OpenClaw local Qwen3 1.7B bounded code block',
            'test_oracle':'TRUSTED_CONTROL_PLANE',
            'reviewer':'independent OpenClaw local Qwen3 1.7B session',
            'deterministic_qa':'PASS',
            'authority':'A2_NO_PUSH_NO_MERGE',
            'promotion_authority':'CONTROL_PLANE_ONLY'
          },indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rotclaw-delegated-engineering-${{ github.sha }}
          path: /tmp/engineering-evidence/
          if-no-files-found: error
          retention-days: 7
