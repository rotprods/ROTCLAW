name: cross-repo-engineering-canary-v3

on:
  push:
    branches: [reconstruct/v6-full-composite]
    paths: ['delegation/cross-repo-engineering-v3/*.json']

permissions:
  contents: read

jobs:
  multi-agent-engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve mission
        id: mission
        shell: bash
        run: |
          set -euo pipefail
          mission="$(git show --pretty='' --name-only "$GITHUB_SHA" | grep '^delegation/cross-repo-engineering-v3/.*\.json$' | head -n1)"
          test -n "$mission"
          echo "path=$mission" >> "$GITHUB_OUTPUT"
      - name: Validate orchestrator syntax
        run: python3 -m py_compile scripts/cross_repo_identity_orchestrator.py
      - name: Install pinned Ollama and local engineering model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ollama.tar.zst https://github.com/ollama/ollama/releases/download/v0.32.14/ollama-linux-amd64.tar.zst
          echo 'c620917a71e146ab3a7f893084f066069c4c65d144ef8379a91c3cbe8b27de8f  /tmp/ollama.tar.zst' | sha256sum -c -
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen3:1.7b-q4_K_M
      - name: Planner Builder Test Security Reviewer pipeline
        run: python3 scripts/cross_repo_identity_orchestrator.py --mission '${{ steps.mission.outputs.path }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rotclaw-cross-repo-engineering-v3-${{ github.sha }}
          path: /tmp/cross-repo-evidence/
          if-no-files-found: error
          retention-days: 7
