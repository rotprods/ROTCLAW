name: openclaw-host-qualification
on:
  push:
    branches: [reconstruct/v6-full-composite]
    paths:
      - '.github/workflows/openclaw-host-qualification.yml'
      - 'scripts/gha_openclaw_qualification.sh'
      - 'scripts/mock_openai_provider.py'
      - 'scripts/router_mapping_check.py'
      - 'router/model_router.py'
      - 'qualification/Dockerfile.openclaw-sandbox'
      - 'config/openclaw.example.json'
      - 'config/model-routing.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Host facts
        run: |
          uname -a
          node --version
          npm --version
          docker --version
      - name: Router mapping contract
        run: python scripts/router_mapping_check.py
      - name: Qualify published OpenClaw 2026.8.1-beta.3
        env:
          OPENCLAW_SPEC: '2026.8.1-beta.3'
        run: bash scripts/gha_openclaw_qualification.sh qa/gha-host
      - name: Publish qualification summary
        run: cat qa/gha-host/QUALIFICATION.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rotclaw-openclaw-host-qualification
          path: qa/gha-host/
          if-no-files-found: error
          retention-days: 30
