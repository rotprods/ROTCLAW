name: openclaw-host-qualification
on:
  push:
    branches: [reconstruct/v6-full-composite]
    paths:
      - '.github/workflows/openclaw-host-qualification.yml'
      - 'scripts/gha_openclaw_qualification.sh'
      - 'scripts/mock_openai_provider.py'
      - 'qualification/Dockerfile.openclaw-sandbox'
      - 'config/openclaw.example.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Host facts
        run: |
          uname -a
          node --version
          npm --version
          docker --version
      - name: Qualify published OpenClaw 2026.8.1-beta.3
        env:
          OPENCLAW_SPEC: '2026.8.1-beta.3'
        run: bash scripts/gha_openclaw_qualification.sh qa/gha-host
      - name: Publish qualification summary
        run: cat qa/gha-host/QUALIFICATION.json
      - uses: actions/upload-artifact@v4
        with:
          name: rotclaw-openclaw-host-qualification
          path: qa/gha-host/
          if-no-files-found: error
          retention-days: 30
