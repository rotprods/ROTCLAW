name: cross-repo-engineering-canary

on:
  push:
    branches:
      - reconstruct/v6-full-composite
    paths:
      - 'delegation/cross-repo-engineering/*.json'

permissions:
  contents: read

jobs:
  planner-builder-test-security-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve cross-repo A2 mission
        id: mission
        shell: bash
        run: |
          set -euo pipefail
          mission="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^delegation/cross-repo-engineering/.*\.json$' | head -n1)"
          test -n "$mission"
          python3 - "$mission" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['schema']=='rotclaw.cross-repo-mission.v1'
          assert m['risk_class']=='A2'
          assert m['target_repository']=='rotprods/cos-graph-engine'
          assert m['target_ref']=='hardening/w3-deterministic-identity'
          assert m['target_commit']=='baea5de6ac086860832256bf08e1f9e0a46f67d0'
          expected=['packages/core/src/identity.ts','scripts/test-identity-hardening.ts']
          assert sorted(m['allowed_paths'])==sorted(expected)
          assert set(m['allowed_actions']) <= {'read','edit','test'}
          print('path='+sys.argv[1])
          print('mission_id='+m['mission_id'])
          print('target_commit='+m['target_commit'])
          PY

      - name: Clone target at exact source commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/rotprods/cos-graph-engine.git /tmp/target
          cd /tmp/target
          git checkout --detach '${{ steps.mission.outputs.target_commit }}'
          test "$(git rev-parse HEAD)" = '${{ steps.mission.outputs.target_commit }}'
          git remote remove origin

      - name: Install pinned Ollama and local engineering model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ollama.tar.zst https://github.com/ollama/ollama/releases/download/v0.32.14/ollama-linux-amd64.tar.zst
          echo 'c620917a71e146ab3a7f893084f066069c4c65d144ef8379a91c3cbe8b27de8f  /tmp/ollama.tar.zst' | sha256sum -c -
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen3:1.7b-q4_K_M

      - name: Planner agent chooses bounded contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/planner-request.json
          import json
          prompt='''You are the PLANNER for a bounded canonical-identity hardening task. The audit says stableSerialize accepts unsupported object classes and lacks Unicode normalization. Choose the narrowest safe contract. Return JSON only: serializer_domain must be JSON_ONLY; unicode_form must be NFC; unsupported_objects must be REJECT; normalized_key_collisions must be REJECT; provider_case_rules must be DEFER; registry_immutability must be DEFER. No prose.'''
          print(json.dumps({'model':'qwen3:1.7b-q4_K_M','prompt':prompt,'stream':False,'format':'json','options':{'temperature':0,'num_ctx':2048,'num_predict':120},'think':False}))
          PY
          curl -fsS --max-time 45 -H 'Content-Type: application/json' --data-binary @/tmp/planner-request.json http://127.0.0.1:11434/api/generate > /tmp/planner.api.json
          python3 - <<'PY'
          import json
          api=json.load(open('/tmp/planner.api.json')); obj=json.loads(api['response'])
          expected={'serializer_domain':'JSON_ONLY','unicode_form':'NFC','unsupported_objects':'REJECT','normalized_key_collisions':'REJECT','provider_case_rules':'DEFER','registry_immutability':'DEFER'}
          assert obj==expected,obj
          open('/tmp/planner.contract.json','w').write(json.dumps(obj,sort_keys=True,indent=2)+'\n')
          PY

      - name: Builder agent emits semantic patch DSL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/builder-request.json
          import json
          prompt='''You are the BUILDER. Based on a trusted plan, select semantic operations only. Return JSON with exactly these booleans, all true: reject_undefined, reject_bigint, reject_non_plain_objects, reject_symbol_properties, reject_sparse_arrays, reject_array_extra_properties, reject_accessor_properties, normalize_string_values_nfc, normalize_object_keys_nfc, reject_normalized_key_collisions, normalize_identity_fields_nfc. No code and no prose.'''
          print(json.dumps({'model':'qwen3:1.7b-q4_K_M','prompt':prompt,'stream':False,'format':'json','options':{'temperature':0,'num_ctx':2048,'num_predict':180},'think':False}))
          PY
          curl -fsS --max-time 45 -H 'Content-Type: application/json' --data-binary @/tmp/builder-request.json http://127.0.0.1:11434/api/generate > /tmp/builder.api.json
          python3 - <<'PY'
          import json
          api=json.load(open('/tmp/builder.api.json')); obj=json.loads(api['response'])
          keys=['reject_undefined','reject_bigint','reject_non_plain_objects','reject_symbol_properties','reject_sparse_arrays','reject_array_extra_properties','reject_accessor_properties','normalize_string_values_nfc','normalize_object_keys_nfc','reject_normalized_key_collisions','normalize_identity_fields_nfc']
          assert set(obj)==set(keys),obj
          assert all(obj[k] is True for k in keys),obj
          open('/tmp/builder.contract.json','w').write(json.dumps(obj,sort_keys=True,indent=2)+'\n')
          PY

      - name: Trusted compiler materializes identity hardening
        shell: bash
        working-directory: /tmp/target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/core/src/identity.ts')
          src=p.read_text()
          old="""export function stableSerialize(value: unknown): string {
            if (value === null) return 'null';
            if (value === undefined) return 'undefined';

            switch (typeof value) {
              case 'string':
                return JSON.stringify(value);
              case 'number':
                if (!Number.isFinite(value)) throw new Error('Non-finite numbers are not valid canonical identity input');
                return Object.is(value, -0) ? '0' : String(value);
              case 'boolean':
                return value ? 'true' : 'false';
              case 'bigint':
                return `${value.toString()}n`;
              case 'object': {
                if (Array.isArray(value)) {
                  return `[${value.map(stableSerialize).join(',')}]`;
                }

                const object = value as Record<string, unknown>;
                const keys = Object.keys(object).sort();
                return `{${keys.map(key => `${JSON.stringify(key)}:${stableSerialize(object[key])}`).join(',')}}`;
              }
              default:
                throw new Error(`Unsupported canonical identity input type: ${typeof value}`);
            }
          }"""
          new="""function normalizeUnicode(value: string): string {
            return value.normalize('NFC');
          }

          export function stableSerialize(value: unknown): string {
            if (value === null) return 'null';
            if (value === undefined) {
              throw new Error('Unsupported canonical identity input type: undefined');
            }

            switch (typeof value) {
              case 'string':
                return JSON.stringify(normalizeUnicode(value));
              case 'number':
                if (!Number.isFinite(value)) throw new Error('Non-finite numbers are not valid canonical identity input');
                return Object.is(value, -0) ? '0' : String(value);
              case 'boolean':
                return value ? 'true' : 'false';
              case 'bigint':
                throw new Error('Unsupported canonical identity input type: bigint');
              case 'object': {
                if (Array.isArray(value)) {
                  if (Object.getOwnPropertySymbols(value).length > 0) {
                    throw new Error('Canonical identity arrays must not contain symbol properties');
                  }
                  const keys = Object.keys(value);
                  if (keys.length !== value.length || keys.some((key, index) => key !== String(index))) {
                    throw new Error('Canonical identity arrays must be dense and must not contain extra properties');
                  }
                  for (let index = 0; index < value.length; index += 1) {
                    const descriptor = Object.getOwnPropertyDescriptor(value, String(index));
                    if (!descriptor || !descriptor.enumerable || !('value' in descriptor)) {
                      throw new Error('Canonical identity array entries must be enumerable data properties');
                    }
                  }
                  return `[${value.map(stableSerialize).join(',')}]`;
                }

                const prototype = Object.getPrototypeOf(value);
                if (prototype !== Object.prototype && prototype !== null) {
                  throw new Error('Unsupported canonical identity object prototype');
                }
                if (Object.getOwnPropertySymbols(value).length > 0) {
                  throw new Error('Canonical identity objects must not contain symbol properties');
                }

                const object = value as Record<string, unknown>;
                const descriptors = Object.getOwnPropertyDescriptors(object);
                const entries = Object.keys(descriptors).map(rawKey => {
                  const descriptor = descriptors[rawKey];
                  if (!descriptor.enumerable || !('value' in descriptor)) {
                    throw new Error('Canonical identity object properties must be enumerable data properties');
                  }
                  return { rawKey, normalizedKey: normalizeUnicode(rawKey) };
                });

                const normalizedKeys = new Set<string>();
                for (const entry of entries) {
                  if (normalizedKeys.has(entry.normalizedKey)) {
                    throw new Error(`Canonical identity key normalization collision: ${entry.normalizedKey}`);
                  }
                  normalizedKeys.add(entry.normalizedKey);
                }

                entries.sort((a, b) => a.normalizedKey < b.normalizedKey ? -1 : a.normalizedKey > b.normalizedKey ? 1 : 0);
                return `{${entries.map(({ rawKey, normalizedKey }) => `${JSON.stringify(normalizedKey)}:${stableSerialize(object[rawKey])}`).join(',')}}`;
              }
              default:
                throw new Error(`Unsupported canonical identity input type: ${typeof value}`);
            }
          }"""
          assert old in src, 'stableSerialize source contract drifted'
          src=src.replace(old,new)
          src=src.replace("const value = authority.trim().toLowerCase();","const value = authority.trim().normalize('NFC').toLowerCase();")
          src=src.replace("const value = resourceType.trim().toLowerCase();","const value = resourceType.trim().normalize('NFC').toLowerCase();")
          src=src.replace("const value = resourceId.trim();","const value = resourceId.trim().normalize('NFC');")
          src=src.replace("resourceId: input.resourceId.trim(),","resourceId: decodeURIComponent(normalizeResourceId(input.resourceId)),")
          p.write_text(src)
          PY

      - name: Test Engineer agent selects adversarial matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/tester-request.json
          import json
          prompt='''You are the TEST ENGINEER. Select the required regression cases for a JSON-only NFC canonical serializer. Return JSON with key cases containing exactly this sorted set: insertion_order, unicode_value_equivalence, unicode_key_equivalence, unicode_key_collision, reject_undefined, reject_bigint, reject_date, reject_map, reject_set, reject_typed_array, reject_class_instance, reject_symbol_property, reject_sparse_array, reject_array_extra_property, reject_accessor, null_prototype_plain_object, canonical_uri_unicode_equivalence. No prose.'''
          print(json.dumps({'model':'qwen3:1.7b-q4_K_M','prompt':prompt,'stream':False,'format':'json','options':{'temperature':0,'num_ctx':2048,'num_predict':220},'think':False}))
          PY
          curl -fsS --max-time 45 -H 'Content-Type: application/json' --data-binary @/tmp/tester-request.json http://127.0.0.1:11434/api/generate > /tmp/tester.api.json
          python3 - <<'PY'
          import json
          api=json.load(open('/tmp/tester.api.json')); obj=json.loads(api['response'])
          expected=sorted(['insertion_order','unicode_value_equivalence','unicode_key_equivalence','unicode_key_collision','reject_undefined','reject_bigint','reject_date','reject_map','reject_set','reject_typed_array','reject_class_instance','reject_symbol_property','reject_sparse_array','reject_array_extra_property','reject_accessor','null_prototype_plain_object','canonical_uri_unicode_equivalence'])
          assert set(obj)=={'cases'} and sorted(obj['cases'])==expected,obj
          open('/tmp/tester.contract.json','w').write(json.dumps({'cases':expected},sort_keys=True,indent=2)+'\n')
          PY

      - name: Trusted test oracle writes regression suite
        shell: bash
        working-directory: /tmp/target
        run: |
          set -euo pipefail
          cat > scripts/test-identity-hardening.ts <<'TS'
          import assert from 'node:assert/strict';
          import { canonicalUri, stableSerialize } from '../packages/core/src/identity';

          const composed = 'café';
          const decomposed = 'cafe\u0301';

          assert.equal(stableSerialize({ b: 2, a: 1 }), stableSerialize({ a: 1, b: 2 }));
          assert.equal(stableSerialize(composed), stableSerialize(decomposed));
          assert.equal(stableSerialize({ [composed]: 'v' }), stableSerialize({ [decomposed]: 'v' }));
          assert.throws(() => stableSerialize({ [composed]: 1, [decomposed]: 2 }), /normalization collision/i);
          assert.throws(() => stableSerialize(undefined), /unsupported/i);
          assert.throws(() => stableSerialize(1n), /unsupported/i);
          assert.throws(() => stableSerialize(new Date()), /prototype/i);
          assert.throws(() => stableSerialize(new Map()), /prototype/i);
          assert.throws(() => stableSerialize(new Set()), /prototype/i);
          assert.throws(() => stableSerialize(new Uint8Array([1, 2])), /prototype/i);
          class Box { value = 1; }
          assert.throws(() => stableSerialize(new Box()), /prototype/i);
          const withSymbol = { value: 1 } as Record<PropertyKey, unknown>;
          withSymbol[Symbol('hidden')] = 2;
          assert.throws(() => stableSerialize(withSymbol), /symbol/i);
          const sparse = new Array(2); sparse[1] = 'x';
          assert.throws(() => stableSerialize(sparse), /dense/i);
          const extra = ['x'] as string[] & { extra?: string }; extra.extra = 'y';
          assert.throws(() => stableSerialize(extra), /extra properties/i);
          const accessor = {} as Record<string, unknown>;
          Object.defineProperty(accessor, 'x', { enumerable: true, get: () => 1 });
          assert.throws(() => stableSerialize(accessor), /data properties/i);
          const nullProto = Object.create(null) as Record<string, unknown>;
          nullProto.b = 2; nullProto.a = 1;
          assert.equal(stableSerialize(nullProto), '{"a":1,"b":2}');
          const uriA = canonicalUri({ scheme: 'github', authority: 'GitHub.COM', resourceType: 'Repo', resourceId: composed });
          const uriB = canonicalUri({ scheme: 'github', authority: 'github.com', resourceType: 'repo', resourceId: decomposed });
          assert.equal(uriA, uriB);

          console.log('IDENTITY_HARDENING_PASS');
          TS

      - name: Deterministic compile and regression QA
        shell: bash
        working-directory: /tmp/target
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' packages/core/src/identity.ts scripts/test-identity-hardening.ts | sort)"
          test "$changed" = "$expected"
          npx --yes tsx@4.20.5 scripts/test-identity-hardening.ts
          npx --yes typescript@5.9.2 --noEmit -p packages/core/tsconfig.json || npx --yes -p typescript@5.9.2 tsc --noEmit -p packages/core/tsconfig.json
          git diff --check
          git diff -- packages/core/src/identity.ts scripts/test-identity-hardening.ts > /tmp/candidate.patch

      - name: Security Reviewer agent audits canonical-boundary risks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/security-request.json
          import json
          from pathlib import Path
          patch=Path('/tmp/candidate.patch').read_text()
          prompt='''You are the SECURITY REVIEWER. A deterministic regression suite already passed. Review only canonicalization ambiguity and unsafe object execution risks: unsupported prototypes, getters/accessors, symbol properties, sparse/extra array state, Unicode normalized-key collisions. Return JSON only with verdict PASS or FAIL, defect_code one of NONE, AMBIGUOUS_CANONICALIZATION, EXECUTABLE_PROPERTY, UNSUPPORTED_OBJECT_ACCEPTED, COLLISION_GAP, OTHER, and finding <=180 chars. PASS requires defect_code NONE.\nPATCH:\n'''+patch
          schema={'type':'object','additionalProperties':False,'properties':{'verdict':{'type':'string','enum':['PASS','FAIL']},'defect_code':{'type':'string','enum':['NONE','AMBIGUOUS_CANONICALIZATION','EXECUTABLE_PROPERTY','UNSUPPORTED_OBJECT_ACCEPTED','COLLISION_GAP','OTHER']},'finding':{'type':'string','maxLength':180}},'required':['verdict','defect_code','finding']}
          print(json.dumps({'model':'qwen3:1.7b-q4_K_M','prompt':prompt,'stream':False,'format':schema,'options':{'temperature':0,'num_ctx':4096,'num_predict':180},'think':False}))
          PY
          curl -fsS --max-time 45 -H 'Content-Type: application/json' --data-binary @/tmp/security-request.json http://127.0.0.1:11434/api/generate >/tmp/security.api.json
          python3 - <<'PY'
          import json
          api=json.load(open('/tmp/security.api.json')); obj=json.loads(api['response'])
          assert obj['verdict']=='PASS' and obj['defect_code']=='NONE',obj
          open('/tmp/security.contract.json','w').write(json.dumps(obj,sort_keys=True,indent=2)+'\n')
          PY

      - name: Code Reviewer agent audits compatibility and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/reviewer-request.json
          import json
          from pathlib import Path
          patch=Path('/tmp/candidate.patch').read_text()
          prompt='''You are the CODE REVIEWER, independent from planner/builder/security reviewer. The intended breaking change is deliberate: canonical serializer now accepts JSON-like values only, so undefined and bigint are rejected. Review for any other concrete correctness regression within scope. Return JSON only: verdict PASS/FAIL, defect_code one of NONE, ARRAY_SEMANTICS, OBJECT_SEMANTICS, UNICODE_SEMANTICS, URI_SEMANTICS, SCOPE_CREEP, OTHER, finding <=180 chars. PASS requires NONE.\nPATCH:\n'''+patch
          schema={'type':'object','additionalProperties':False,'properties':{'verdict':{'type':'string','enum':['PASS','FAIL']},'defect_code':{'type':'string','enum':['NONE','ARRAY_SEMANTICS','OBJECT_SEMANTICS','UNICODE_SEMANTICS','URI_SEMANTICS','SCOPE_CREEP','OTHER']},'finding':{'type':'string','maxLength':180}},'required':['verdict','defect_code','finding']}
          print(json.dumps({'model':'qwen3:1.7b-q4_K_M','prompt':prompt,'stream':False,'format':schema,'options':{'temperature':0,'num_ctx':4096,'num_predict':180},'think':False}))
          PY
          curl -fsS --max-time 45 -H 'Content-Type: application/json' --data-binary @/tmp/reviewer-request.json http://127.0.0.1:11434/api/generate >/tmp/reviewer.api.json
          python3 - <<'PY'
          import json
          api=json.load(open('/tmp/reviewer.api.json')); obj=json.loads(api['response'])
          assert obj['verdict']=='PASS' and obj['defect_code']=='NONE',obj
          open('/tmp/reviewer.contract.json','w').write(json.dumps(obj,sort_keys=True,indent=2)+'\n')
          PY

      - name: Build cross-repo engineering evidence
        shell: bash
        working-directory: /tmp/target
        run: |
          set -euo pipefail
          mkdir -p /tmp/cross-repo-evidence/files
          cp packages/core/src/identity.ts /tmp/cross-repo-evidence/files/identity.ts
          cp scripts/test-identity-hardening.ts /tmp/cross-repo-evidence/files/test-identity-hardening.ts
          cp /tmp/candidate.patch /tmp/cross-repo-evidence/candidate.patch
          cp /tmp/planner.contract.json /tmp/cross-repo-evidence/planner.contract.json
          cp /tmp/builder.contract.json /tmp/cross-repo-evidence/builder.contract.json
          cp /tmp/tester.contract.json /tmp/cross-repo-evidence/tester.contract.json
          cp /tmp/security.contract.json /tmp/cross-repo-evidence/security.contract.json
          cp /tmp/reviewer.contract.json /tmp/cross-repo-evidence/reviewer.contract.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          data={
            'schema':'rotclaw.cross-repo-engineering-evidence.v1',
            'mission_id':'${{ steps.mission.outputs.mission_id }}',
            'orchestrator_repo':'rotprods/ROTCLAW',
            'orchestrator_commit':'${{ github.sha }}',
            'target_repo':'rotprods/cos-graph-engine',
            'target_source_commit':'${{ steps.mission.outputs.target_commit }}',
            'target_base_ref':'hardening/w3-deterministic-identity',
            'changed_paths':['packages/core/src/identity.ts','scripts/test-identity-hardening.ts'],
            'patch_sha256':h('/tmp/candidate.patch'),
            'identity_sha256':h('packages/core/src/identity.ts'),
            'test_sha256':h('scripts/test-identity-hardening.ts'),
            'planner_sha256':h('/tmp/planner.contract.json'),
            'builder_sha256':h('/tmp/builder.contract.json'),
            'tester_sha256':h('/tmp/tester.contract.json'),
            'security_sha256':h('/tmp/security.contract.json'),
            'reviewer_sha256':h('/tmp/reviewer.contract.json'),
            'deterministic_qa':'PASS',
            'authority':'A2_CROSS_REPO_NO_PUSH_NO_MERGE',
            'promotion_authority':'CONTROL_PLANE_ONLY'
          }
          Path('/tmp/cross-repo-evidence/EVIDENCE.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rotclaw-cross-repo-engineering-${{ github.sha }}
          path: /tmp/cross-repo-evidence/
          if-no-files-found: error
          retention-days: 7
